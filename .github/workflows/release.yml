name: Build extension release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Package extension
        run: cd dist && zip -r ../azure-boards-modernizer-${{ github.ref_name }}.zip .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-boards-modernizer-${{ github.ref_name }}
          path: azure-boards-modernizer-${{ github.ref_name }}.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "azure-boards-modernizer-${{ github.ref_name }}.zip" --generate-notes
