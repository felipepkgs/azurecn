name: Selector or visual breakage
description: Report a page that Azure Boards Modernizer no longer styles correctly.
title: "[Breakage]: "
labels: ["bug", "selector-breakage"]
body:
  - type: input
    id: route
    attributes:
      label: Azure DevOps URL pattern
      description: Redact organization, project, and work-item names.
      placeholder: /{org}/{project}/_boards/backlogs/Stories
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension and browser version
    validations:
      required: true
  - type: dropdown
    id: settings
    attributes:
      label: Appearance setting
      options: [System + comfortable, System + compact, Light + comfortable, Light + compact, Dark + comfortable, Dark + compact]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What looks wrong?
      description: Include a redacted screenshot if possible.
    validations:
      required: true
